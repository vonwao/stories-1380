<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Book · listening</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; background:#14151a; color:#e9e9ee;
         font:16px/1.5 -apple-system,Segoe UI,Roboto,sans-serif; padding:18px 14px 130px; }
  .wrap { max-width:680px; margin:0 auto; }
  header { margin-bottom:6px; }
  .series { color:#9a9aa6; font-size:12.5px; letter-spacing:.06em; text-transform:uppercase; }
  h1 { font-size:26px; margin:2px 0 4px; }
  .blurb { color:#b9b9c4; font-size:14px; margin:6px 0 2px; }
  .sub { color:#8a8a96; font-size:12.5px; margin-top:6px; }
  .sub a { color:#7ab8ff; text-decoration:none; }
  .progressline { margin:14px 0 4px; color:#8a8a96; font-size:12.5px; }
  .chapters { margin-top:10px; }
  .ch { display:flex; align-items:center; gap:12px; background:#1c1d24; border:1px solid #23242c;
        border-radius:12px; padding:12px 14px; margin:8px 0; cursor:pointer; }
  .ch:active { transform:scale(.995); }
  .ch.disabled { opacity:.45; cursor:default; }
  .ch.playing { border-color:#4a6ee0; }
  .num { color:#8a8a96; font-size:12px; min-width:26px; }
  .cinfo { flex:1; min-width:0; }
  .ctitle { font-weight:600; font-size:15.5px; }
  .cmeta { color:#8a8a96; font-size:12px; display:flex; gap:8px; margin-top:1px; }
  .resume { color:#7fdca0; }
  .done { color:#7fdca0; }
  .playbtn { width:38px; height:38px; border-radius:50%; border:1px solid #33343e; background:#23242c;
             color:#e9e9ee; font-size:14px; flex:none; display:flex; align-items:center; justify-content:center; }
  .ch.playing .playbtn { background:#2a3a6b; border-color:#4a6ee0; }
  .player { position:fixed; left:0; right:0; bottom:0; background:#181920f2; backdrop-filter:blur(8px);
            border-top:1px solid #2a2b34; padding:10px 14px calc(10px + env(safe-area-inset-bottom)); }
  .pwrap { max-width:680px; margin:0 auto; }
  .pnow { font-size:13px; color:#b9b9c4; margin-bottom:6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pnow b { color:#e9e9ee; }
  .prow { display:flex; align-items:center; gap:10px; }
  audio { flex:1; height:36px; }
  .spd { background:#23242c; border:1px solid #33343e; color:#bfc6d4; border-radius:8px;
         padding:6px 10px; font-size:12.5px; min-width:52px; }
  .hidden { display:none; }
  .msg { color:#9a9aa6; text-align:center; margin:30px 0; }
</style>
</head>
<body>
<div class="wrap">
  <header id="head"></header>
  <div class="progressline" id="prog"></div>
  <div class="chapters" id="list"><div class="msg">loading…</div></div>
</div>
<div class="player hidden" id="player">
  <div class="pwrap">
    <div class="pnow" id="pnow"></div>
    <div class="prow">
      <audio id="au" controls preload="metadata"></audio>
      <button class="spd" id="spd">1×</button>
    </div>
  </div>
</div>
<script>
(async function () {
  const qs = new URLSearchParams(location.search);
  const manifest = await (await fetch("books.json", { cache: "no-store" })).json();
  const book = manifest.books.find(b => b.id === qs.get("book")) || manifest.books[0];
  if (!book) { document.getElementById("list").innerHTML = '<div class="msg">no books yet</div>'; return; }

  document.title = book.title + " · listening";
  const head = document.getElementById("head");
  head.innerHTML = `
    <div class="series">${book.series || ""}</div>
    <h1>${book.title}</h1>
    <div class="blurb">${book.blurb || ""}</div>
    <div class="sub">${book.status || ""}${book.text ? ` · <a href="${book.text}">read the text ↗</a>` : ""}</div>`;

  const KEY = "bookpos:" + book.id;
  const state = JSON.parse(localStorage.getItem(KEY) || "{}"); // {n: seconds|"done"}
  const save = () => localStorage.setItem(KEY, JSON.stringify(state));

  const au = document.getElementById("au");
  const player = document.getElementById("player");
  const pnow = document.getElementById("pnow");
  const spd = document.getElementById("spd");
  const speeds = [1, 1.15, 1.3, 0.9];
  let spi = +(localStorage.getItem("bookspeed") || 0);
  const applySpeed = () => { au.playbackRate = speeds[spi]; spd.textContent = speeds[spi] + "×"; };
  spd.onclick = () => { spi = (spi + 1) % speeds.length; localStorage.setItem("bookspeed", spi); applySpeed(); };

  let current = null;
  const fmt = s => Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");

  function renderList() {
    const list = document.getElementById("list");
    list.innerHTML = "";
    let doneCount = 0;
    for (const ch of book.chapters) {
      const has = !!ch.audio;
      const st = state[ch.n];
      if (st === "done") doneCount++;
      const div = document.createElement("div");
      div.className = "ch" + (has ? "" : " disabled") + (current === ch ? " playing" : "");
      const metaBits = [];
      if (ch.voice) metaBits.push(ch.voice);
      if (ch.minutes) metaBits.push("~" + ch.minutes + " min");
      if (!has) metaBits.push("coming soon");
      if (st === "done") metaBits.push('<span class="done">✓ finished</span>');
      else if (typeof st === "number" && st > 20) metaBits.push('<span class="resume">resume ' + fmt(st) + "</span>");
      div.innerHTML = `
        <div class="num">${ch.n === 0 ? "◦" : String(ch.n).padStart(2, "0")}</div>
        <div class="cinfo">
          <div class="ctitle">${ch.title}</div>
          <div class="cmeta">${metaBits.join(" · ")}</div>
        </div>
        <div class="playbtn">${current === ch && !au.paused ? "❚❚" : "▶"}</div>`;
      if (has) div.onclick = () => (current === ch ? (au.paused ? au.play() : au.pause()) : play(ch));
      list.appendChild(div);
    }
    const total = book.chapters.filter(c => c.audio).length;
    document.getElementById("prog").textContent =
      doneCount ? `${doneCount} of ${total} chapters finished` : `${total} chapters available`;
  }

  function play(ch) {
    current = ch;
    player.classList.remove("hidden");
    pnow.innerHTML = `Now playing — <b>${ch.title}</b>` + (ch.voice ? ` · ${ch.voice}` : "");
    au.src = ch.audio;
    const st = state[ch.n];
    au.currentTime = typeof st === "number" ? st : 0;
    applySpeed();
    au.play();
    renderList();
  }

  setInterval(() => {
    if (current && !au.paused && au.duration) {
      state[current.n] = au.currentTime >= au.duration - 8 ? "done" : Math.floor(au.currentTime);
      save();
    }
  }, 5000);

  au.addEventListener("ended", () => {
    state[current.n] = "done"; save();
    const i = book.chapters.indexOf(current);
    const next = book.chapters.slice(i + 1).find(c => c.audio);
    if (next) play(next); else { current = null; renderList(); }
  });
  au.addEventListener("play", renderList);
  au.addEventListener("pause", renderList);

  renderList();
  const firstUnfinished = book.chapters.find(c => c.audio && state[c.n] !== "done");
  if (firstUnfinished && typeof state[firstUnfinished.n] === "number") {
    // show resume affordance without autoplaying
    pnow.innerHTML = `Resume — <b>${firstUnfinished.title}</b>`;
  }
})();
</script>
</body>
</html>
